<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Pygame Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        .game-container {
            display: inline-block;
            margin: 20px 0;
        }
        h1 {
            margin-bottom: 20px;
        }
        p {
            margin: 10px 0;
        }
        #canvas {
            width: 800px;
            height: 600px;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Online Pygame Demo</h1>
        <div class="game-container">
            <div id="canvas"></div>
        </div>
        <p>Controls: Left/Right arrows to move. Avoid the falling blocks!</p>
        <p>Press SPACE to restart after game over.</p>
    </div>
    
    <script src="main.js"></script>
</body>
</html>

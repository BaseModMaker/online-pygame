name: Build Space Invaders with Pygbag
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-pygbag:
    name: Sandy Inspires - Space Invaders Game
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        echo "Installing dependencies..."
        python -m pip install --upgrade pip
        if [ -f space_invaders/requirements.txt ]; then
          python -m pip install -r space_invaders/requirements.txt
        fi
        python -m pip install pygame-ce pygbag
        echo "Dependencies installed successfully."
        
    - name: List workspace content
      run: |
        echo "Listing workspace content for debugging:"
        ls -la $GITHUB_WORKSPACE
        ls -la $GITHUB_WORKSPACE/space_invaders
        ls -la $GITHUB_WORKSPACE/space_invaders/images || echo "No images directory"
        ls -la $GITHUB_WORKSPACE/space_invaders/sounds || echo "No sounds directory"
        ls -la $GITHUB_WORKSPACE/space_invaders/fonts || echo "No fonts directory"
        
    - name: Build with Pygbag
      run: |
        echo "Attempting to build the game with pygbag..."
        cd $GITHUB_WORKSPACE
        python -m pygbag --build space_invaders/main.py
        echo "Pygbag build complete!"
        echo "Checking build output directories:"
        ls -la space_invaders/build || echo "No build directory found"
        ls -la space_invaders/build/web || echo "No web directory found in build"

    - name: Setup Pages
      uses: actions/configure-pages@v3
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: 'space_invaders/build/web'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
      
    - name: Output Pages URL
      run: |
        echo "✅ Deployment complete!"
        echo "📝 Your game should be available at: https://$(echo $GITHUB_REPOSITORY | cut -d "/" -f 1).github.io/$(echo $GITHUB_REPOSITORY | cut -d "/" -f 2)/"